name: 构建 APK

# 触发方式：
#   1. 推代码到 main / master —— 自动开始
#   2. Actions 页面点「Run workflow」—— 手动开始
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 Debug 包
    runs-on: ubuntu-latest

    # 需要在构建失败时把错误日志 commit 回仓库
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 说明：故意不使用 android-actions/setup-android@v3
      # 它内部会安装 tools 包，而新版 cmdline-tools(16.0) 已移除该包，
      # 必然报 "Failed to find package 'tools'" 而失败。
      - name: 配置 Android SDK
        run: |
          set +e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 根目录：$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager：$SDKMANAGER"

          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" 2>/dev/null
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -8
          else
            echo "未找到 sdkmanager，直接使用 runner 预装环境"
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "--- 已有 platforms ---"
          ls "$SDK_ROOT/platforms" 2>/dev/null
          echo "--- 已有 build-tools ---"
          ls "$SDK_ROOT/build-tools" 2>/dev/null
          exit 0

      # 自动定位工程根目录：settings.gradle.kts 在根目录或被套一层都能处理
      - name: 构建 Debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          if [ -f settings.gradle.kts ]; then
            ROOT="."
          else
            FOUND=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "仓库里找不到 settings.gradle.kts" | tee /tmp/build.log
              exit 1
            fi
            ROOT=$(dirname "$FOUND")
          fi
          echo "工程根目录：$ROOT"
          cd "$ROOT"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # 无论成败都把状态回传仓库，本地 git pull 即可判断结果
      - name: 回传构建状态
        if: always()
        run: |
          set +e
          mkdir -p ci-logs

          {
            echo "构建结果：${{ steps.build.outcome }}"
            echo "时间：$(date -u)"
          } > ci-logs/last-build.txt

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            {
              echo "----- 编译错误（e: 开头）-----"
              grep -E "^e: " /tmp/build.log | head -200
              echo ""
              echo "----- 其他错误行 -----"
              grep -E "error:|FAILURE:|What went wrong|Could not resolve|Caused by" /tmp/build.log | head -100
              echo ""
              echo "----- 日志尾部 150 行 -----"
              tail -150 /tmp/build.log
            } > ci-logs/last-error.log
            echo "错误日志行数：$(wc -l < ci-logs/last-error.log)"
          else
            rm -f ci-logs/last-error.log
            echo "构建成功，已清除旧错误日志"
          fi

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A ci-logs
          git commit -m "CI 构建状态：${{ steps.build.outcome }} [skip ci]" || echo "无变化，跳过提交"
          git push || echo "推送失败（可能无写权限）"
          exit 0

      - name: 构建失败则终止
        if: steps.build.outcome == 'failure'
        run: |
          echo "构建失败，日志已回传 ci-logs/last-error.log"
          exit 1

      - name: 收集 APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p apk-output
          find . -name "*.apk" -type f ! -name "*-androidTest.apk" -exec cp {} apk-output/ \;
          if [ -z "$(ls -A apk-output)" ]; then
            echo "没有产出 APK"
            exit 1
          fi
          cd apk-output
          for f in *.apk; do
            case "$f" in
              *debug*) mv "$f" "StickerFerry-debug.apk" ;;
            esac
          done
          ls -lh

      - name: 上传 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: StickerFerry-APK
          path: apk-output/*.apk
          retention-days: 90
          if-no-files-found: error

      # Artifacts 走境外 CDN，国内下载经常中断。
      # 这里把 APK 额外推到一个独立分支 apk-latest ——
      # 用 git 拉取即可（SSH 通道稳定，且天然支持增量/断点续传）。
      # 每次 force push 覆盖，分支永远只有一个 commit，不会让仓库膨胀。
      - name: 推送 APK 到 apk-latest 分支
        if: steps.build.outcome == 'success'
        run: |
          set +e
          mkdir -p /tmp/apkpush
          cp apk-output/*.apk /tmp/apkpush/
          cd /tmp/apkpush
          git init -q
          git checkout -q -b apk-latest
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "APK build $(date -u +%Y%m%d-%H%M)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin apk-latest && echo "已推送 apk-latest 分支" || echo "推送失败"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出安装说明
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in apk-output/*.apk; do
              [ -e "$f" ] || continue
              echo "| $(basename $f) | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "### 下载方式一（推荐，国内更稳）"
            echo ""
            echo "APK 已推到独立分支 \`apk-latest\`，用 git 拉取，可断点续传："
            echo ""
            echo '```bash'
            echo "git clone --depth 1 -b apk-latest git@github.com:${{ github.repository }}.git apk"
            echo '```'
            echo ""
            echo "### 下载方式二（Artifacts）"
            echo ""
            echo "本页最下方 Artifacts 区域。走境外 CDN，国内可能中途断开。"
            echo ""
            echo "### 安装步骤"
            echo "1. 取出 apk 文件"
            echo "2. 传到手机（数据线 / 微信文件传输助手）"
            echo "3. 点开安装，提示「未知来源」时允许安装"
          } >> $GITHUB_STEP_SUMMARY
